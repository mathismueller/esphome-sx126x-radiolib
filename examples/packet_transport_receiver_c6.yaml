# packet_transport receiver (C6): shows shared_counter from lora-provider as a local sensor.
# Same D-label stacking as S3, translated to C6 GPIOs.
esphome:
  name: lora-receiver-c6
  friendly_name: LoRa Receiver C6

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: "dummy"
  password: "dummy12345"
  ap:
    ssid: "LoRa Receiver C6"

external_components:
  # Release source. For local development against a clone, use:
  #   - source:
  #       type: local
  #       path: ../components
  #     components: [sx126x_radiolib]
  - source: github://mathismueller/esphome-sx126x-radiolib@main
    components: [sx126x_radiolib]

sx126x_radiolib:
  id: radio
  cs_pin: GPIO22
  sck_pin: GPIO19
  mosi_pin: GPIO18
  miso_pin: GPIO20
  dio1_pin: GPIO1
  busy_pin: GPIO21
  rst_pin: GPIO2
  rxen_pin: GPIO23
  rf_switch: true
  hw_version: sx1262
  modulation: LORA
  frequency: 868.0MHz
  bandwidth: 125_0kHz
  spreading_factor: 9
  coding_rate: CR_4_7
  sync_value: [0x12]
  preamble_size: 8
  crc_enable: true
  pa_power: 10
  tcxo_voltage: 1_8V

packet_transport:
  - platform: sx126x_radiolib
    id: transport
    sx126x_radiolib_id: radio

sensor:
  - platform: packet_transport
    transport_id: transport
    provider: lora-provider
    remote_id: shared_counter
    name: "Remote Counter"
    internal: true
