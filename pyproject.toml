[project]
name = "esphome-sx126x-radiolib"
version = "0.1.0"
description = "ESPHome external component: SX126x LoRa via RadioLib, with MCU-driven RX/TX switch pins"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "clang-format>=18",
    "esphome==2026.10.2",
    "pytest>=8.0",
    "ruff>=0.14",
    "yamllint>=1.37",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: full firmware compile, needs toolchains + network (opt-in via -m slow)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["sx126x_radiolib"]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
