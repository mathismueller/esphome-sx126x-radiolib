# Example: Seeed XIAO ESP32C6 + Wio-SX1262 V1.0 header board (stacked D-to-D).
# Same D-label stacking as the S3 example, translated to C6 GPIOs:
#   D1->GPIO1 DIO1, D2->GPIO2 RST, D3->GPIO21 BUSY, D4->GPIO22 CS,
#   D5->GPIO23 RF_SW, D8->GPIO19 SCK, D9->GPIO20 MISO, D10->GPIO18 MOSI

esphome:
  name: lora-test-c6
  friendly_name: LoRa Test C6

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: "dummy"
  password: "dummy12345"
  ap:
    ssid: "LoRa Test C6"

external_components:
  # Release source. For local development against a clone, use:
  #   - source:
  #       type: local
  #       path: ../components
  #     components: [sx126x_radiolib]
  - source: github://mathismueller/esphome-sx126x-radiolib@main
    components: [sx126x_radiolib]

sx126x_radiolib:
  id: radio
  cs_pin: GPIO22
  sck_pin: GPIO19
  mosi_pin: GPIO18
  miso_pin: GPIO20
  dio1_pin: GPIO1
  busy_pin: GPIO21
  rst_pin: GPIO2
  rxen_pin: GPIO23
  rf_switch: true
  hw_version: sx1262
  modulation: LORA
  frequency: 868.0MHz
  bandwidth: 125_0kHz
  spreading_factor: 9
  coding_rate: CR_4_7
  sync_value: [0x12]
  preamble_size: 8
  crc_enable: true
  pa_power: 10
  tcxo_voltage: 1_8V
  on_packet:
    then:
      - lambda: |-
          ESP_LOGI("lora", "rx len=%d rssi=%.1f snr=%.1f", x.size(), rssi, snr);

button:
  - platform: template
    name: "Transmit Packet"
    on_press:
      then:
        - sx126x_radiolib.send_packet:
            data: [0xC5, 0x51, 0x78, 0x82]
