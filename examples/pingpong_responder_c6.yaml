# PingPong responder: XIAO ESP32C6 + Wio-SX1262 V1.0, replies PONG to PING.
# Same D-label stacking as S3, translated to C6 GPIOs.
esphome:
  name: lora-pong-idf
  friendly_name: LoRa Pong IDF

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: "dummy"
  password: "dummy12345"
  ap:
    ssid: "LoRa Pong IDF"

external_components:
  # Release source. For local development against a clone, use:
  #   - source:
  #       type: local
  #       path: ../components
  #     components: [sx126x_radiolib]
  - source: github://mathismueller/esphome-sx126x-radiolib@main
    components: [sx126x_radiolib]

sx126x_radiolib:
  id: radio
  cs_pin: GPIO22
  sck_pin: GPIO19
  mosi_pin: GPIO18
  miso_pin: GPIO20
  dio1_pin: GPIO1
  busy_pin: GPIO21
  rst_pin: GPIO2
  rxen_pin: GPIO23
  rf_switch: true
  hw_version: sx1262
  modulation: LORA
  frequency: 868.0MHz
  bandwidth: 125_0kHz
  spreading_factor: 9
  coding_rate: CR_4_7
  sync_value: [0x12]
  preamble_size: 8
  crc_enable: true
  pa_power: 10
  tcxo_voltage: 1_8V
  on_packet:
    then:
      - lambda: |-
          std::string msg(x.begin(), x.end());
          ESP_LOGI("pong", "RX '%s' len=%d rssi=%.1f snr=%.1f",
                   msg.c_str(), x.size(), rssi, snr);
          if (msg.rfind("PING", 0) == 0) {
            static int counter = 0;
            char buf[32];
            snprintf(buf, sizeof(buf), "PONG #%d", counter++);
            ESP_LOGI("pong", "TX %s", buf);
            id(radio).transmit_packet(std::vector<uint8_t>(buf, buf + strlen(buf)));
          }
